<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earthquake Adventure</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Noto Sans Thai",sans-serif;background:#63c8f1}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#62c8f2,#dff5f8)}
#world{position:absolute;inset:0;will-change:transform}.scene{position:absolute;top:0;width:100vw;height:100%;overflow:hidden}
.sky{position:absolute;inset:0;background:linear-gradient(#62c8f2,#e8f7f8)}.sun{position:absolute;right:9%;top:8%;width:85px;height:85px;border-radius:50%;background:#fff2a0;box-shadow:0 0 45px #fff2a0}
.ground{position:absolute;bottom:0;width:100%;height:38%;background:linear-gradient(#70b95a,#3f8139)}
.road{position:absolute;bottom:0;width:100%;height:27%;background:#363a3e;border-top:5px solid #777}.road:after{content:"";position:absolute;top:50%;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,#eadf86 0 75px,transparent 75px 145px)}
.sidewalk{position:absolute;bottom:27%;width:100%;height:45px;background:repeating-linear-gradient(90deg,#b8bdc0 0 75px,#858b8e 75px 80px);border-top:4px solid #ddd}
.mountains{position:absolute;bottom:36%;width:100%;height:35%}.mountain{position:absolute;bottom:0;width:0;height:0;border-left:220px solid transparent;border-right:220px solid transparent;border-bottom:300px solid #57936c}.m1{left:-100px}.m2{left:30%;transform:scale(.8)}.m3{left:65%;transform:scale(1.1)}
.city{position:absolute;bottom:36%;width:100%;height:32%;display:flex;align-items:flex-end;justify-content:space-around;padding:0 4%}.building{position:relative;width:10%;min-width:55px;max-width:105px;background:linear-gradient(90deg,#59666e,#b1bdc1 45%,#59666e)}.building:after{content:"";position:absolute;inset:12px;background:repeating-linear-gradient(#ffe993 0 9px,transparent 9px 24px)}.b1{height:140px}.b2{height:200px}.b3{height:170px}.b4{height:245px}.b5{height:185px}
.tree{position:absolute;bottom:29%;width:75px;height:155px}.trunk{position:absolute;bottom:0;left:31px;width:13px;height:70px;background:#66472f}.leaf{position:absolute;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#a4d975,#43883f)}.a{left:0;bottom:45px}.b{left:25px;bottom:72px}.c{left:-15px;bottom:70px}
.lamp{position:absolute;bottom:29%;width:10px;height:170px;background:#30363a}.lamp:before{content:"";position:absolute;top:-7px;left:-20px;width:50px;height:8px;background:#30363a}.lamp:after{content:"";position:absolute;top:-14px;left:20px;width:17px;height:17px;border-radius:50%;background:#fff1a0;box-shadow:0 0 20px #fff1a0}
.car{position:absolute;bottom:28%;width:125px;height:45px;border-radius:18px 22px 8px 8px;background:#e23d48}.car:before{content:"";position:absolute;left:28px;top:-23px;width:62px;height:28px;border-radius:17px 17px 0 0;background:#a8d8e7}.wheel{position:absolute;bottom:-15px;width:28px;height:28px;border-radius:50%;background:#111;border:5px solid #555}.w1{left:15px}.w2{right:15px}
#world.shake{animation:shake .09s infinite}@keyframes shake{25%{transform:translate(-7px,3px)}50%{transform:translate(7px,-3px)}75%{transform:translate(-4px,-2px)}}
#player{position:absolute;z-index:20;left:37%;bottom:27%;width:72px;height:132px;pointer-events:none}.shadow{position:absolute;left:50%;bottom:-7px;width:55px;height:11px;transform:translateX(-50%);border-radius:50%;background:#0005;filter:blur(3px)}.head{position:absolute;left:20px;top:1px;width:35px;height:35px;border-radius:50%;background:#e4a06b;border:2px solid #563625}.hair{position:absolute;z-index:2;left:18px;top:-2px;width:39px;height:21px;border-radius:50%;background:#29231f}.body{position:absolute;left:21px;top:33px;width:31px;height:51px;border-radius:8px;background:linear-gradient(90deg,#1747bd,#4385ff,#173b9b)}.bag{position:absolute;left:8px;top:39px;width:15px;height:39px;border-radius:6px;background:#704329}.arm{position:absolute;top:39px;width:9px;height:34px;border-radius:7px;background:#df9865;transform-origin:top}.al{left:15px}.ar{right:15px}.leg{position:absolute;top:80px;width:11px;height:43px;border-radius:7px;background:#202938;transform-origin:top}.ll{left:23px}.lr{right:23px}.leg:after{content:"";position:absolute;bottom:-5px;width:21px;height:9px;border-radius:8px;background:#111}.ll:after{left:-5px}.lr:after{right:-5px}
#player.walk{animation:bw .42s infinite alternate ease-in-out}#player.walk .ll{animation:ll .42s infinite alternate}#player.walk .lr{animation:lr .42s infinite alternate}#player.walk .al{animation:al .42s infinite alternate}#player.walk .ar{animation:ar .42s infinite alternate}
@keyframes bw{to{transform:translateY(-3px) rotate(1deg)}}@keyframes ll{to{transform:rotate(-22deg)}}@keyframes lr{to{transform:rotate(22deg)}}@keyframes al{to{transform:rotate(4deg)}}@keyframes ar{to{transform:rotate(-4deg)}}
#player.fall{animation:fall 1.2s forwards!important}@keyframes fall{40%{transform:translateY(55px) rotate(30deg)}100%{transform:translateY(520px) rotate(105deg);opacity:.1}}
#hud{position:absolute;z-index:50;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}.panel{padding:10px 15px;border-radius:14px;color:#fff;background:#08121ecc}.stats{display:flex;gap:16px}
#msg{position:absolute;z-index:60;top:75px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:30px;color:#fff;background:#000c;opacity:0;transition:.3s;white-space:nowrap}#msg.show{opacity:1}
#qlayer{position:absolute;inset:0;z-index:100;pointer-events:none}#qbox{position:absolute;left:50%;top:50%;width:min(92%,650px);padding:28px;border-radius:24px;color:#fff;background:linear-gradient(145deg,#17263a,#08111e);box-shadow:0 30px 100px #000b;transform:translate(-50%,-50%) scale(.85);opacity:0;pointer-events:none;transition:.25s}#qbox.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}#q{font-size:clamp(20px,3vw,30px);font-weight:900;line-height:1.4;margin:10px 0 20px}.qt{color:#facc15;font-weight:900}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:58px;border:0;border-radius:14px;padding:12px;color:#fff;background:#263a53;font-weight:800;cursor:pointer}.answer.correct{background:#15803d}.answer.wrong{background:#b91c1c}.answer:disabled{cursor:default}
.overlay{position:absolute;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:#030911e6}.card{width:min(92%,580px);padding:40px 30px;text-align:center;border-radius:28px;color:#fff;background:#101d2d;box-shadow:0 30px 100px #0009}.card h1{font-size:clamp(30px,6vw,50px);margin:0 0 15px}.card p{color:#bdc9d8;line-height:1.8;margin-bottom:25px}.btn{border:0;padding:15px 35px;border-radius:14px;color:#fff;background:#2563eb;font-weight:900;cursor:pointer}.result{display:flex;justify-content:center;gap:30px;margin:20px 0 28px}.result b{font-size:28px}.hidden{display:none!important}
@media(max-width:700px){#player{left:29%;transform:scale(.88);transform-origin:bottom center}.stats{gap:7px;font-size:11px}.panel{padding:8px 10px}#qbox{width:92%;padding:21px}.answers{grid-template-columns:1fr}.answer{min-height:50px;font-size:14px}#msg{font-size:12px;top:68px}}
</style></head>
<body><div id="game">
<div class="sky"><div class="sun"></div></div><div id="world"></div>
<div id="player"><div class="shadow"></div><div class="bag"></div><div class="hair"></div><div class="head"></div><div class="body"></div><div class="arm al"></div><div class="arm ar"></div><div class="leg ll"></div><div class="leg lr"></div></div>
<div id="hud"><div class="panel"><b>🌍 Earthquake Adventure</b></div><div class="panel stats">คำถาม <b id="prog">0/25</b> · ถูก <b id="ok">0</b></div></div>
<div id="msg"></div><div id="qlayer"><div id="qbox"><div class="qt">⚠️ แผ่นดินไหว! ตอบให้ถูกเพื่อเดินต่อ</div><div id="q"></div><div class="answers" id="answers"></div></div></div>
<div id="start" class="overlay"><div class="card"><h1>🌍 Earthquake Adventure</h1><p>เดินไปทางขวา พบคำถามทุกประมาณ 20 วินาที<br>ตอบถูก = แผ่นดินไหวหายและเดินต่อ<br>ตอบผิด = ตกและเริ่มใหม่</p><button id="startBtn" class="btn">เริ่มเกม</button></div></div>
<div id="end" class="overlay hidden"><div class="card"><h1>🎉 จบเกม!</h1><p>ตอบครบทั้ง 25 คำถามแล้ว</p><div class="result">ถูก <b id="fc">0</b> · ผิด <b id="fw">0</b></div><button id="again" class="btn">เล่นอีกครั้ง</button></div></div>
</div>
<script>
(()=>{const $=id=>document.getElementById(id),world=$("world"),player=$("player"),qbox=$("qbox"),q=$("q"),answers=$("answers"),prog=$("prog"),ok=$("ok"),msg=$("msg");
const data=[
["สาเหตุหลักของการเกิดแผ่นดินไหวคืออะไร?",["ภูเขาไฟระเบิด","การเคลื่อนที่และเสียดสีกันของแผ่นเปลือกโลก","การยุบตัวของพื้นดิน","มนุษย์ทำกิจกรรมใต้ดิน"],1],
["จุดที่อยู่ลึกใต้พื้นดิน ซึ่งเป็นจุดเริ่มต้นของการแตกหรือเคลื่อนตัวของหิน เรียกว่าอะไร?",["จุดศูนย์กลางบนผิวโลก","จุดกำเนิดแผ่นดินไหว","แนวรอยเลื่อน","แนวรอยต่อแผ่นเปลือกโลก"],1],
["จุดบนผิวโลกที่อยู่ตรงข้ามจุดกำเนิดแผ่นดินไหวโดยตรง เรียกว่าอะไร?",["จุดศูนย์กลางบนผิวโลก","จุดกำเนิด","แนวรอยเลื่อน","แนวเขตภูเขาไฟ"],0],
["เครื่องมือที่ใช้บันทึกและวัดคลื่นแผ่นดินไหว เรียกว่าอะไร?",["เทอร์โมมิเตอร์","เครื่องวัดคลื่นไหว","บารอมิเตอร์","แอมมิเตอร์"],1],
["มาตราที่ใช้บอกขนาดความเข้มของแผ่นดินไหวโดยอาศัยพลังงานที่ปล่อยออกมา คือมาตราใด?",["มาตราริกเตอร์","มาตราเมตริก","มาตราเซลเซียส","มาตราฟาเรนไฮต์"],0],
["คลื่นแผ่นดินไหวชนิดใดเดินทางเร็วที่สุดและถึงก่อนคลื่นชนิดอื่น?",["คลื่นปฐม (P-wave)","คลื่นทุติย (S-wave)","คลื่นผิว","คลื่นน้ำ"],0],
["ข้อใดเป็นลักษณะการเคลื่อนที่ของคลื่นทุติย (S-wave)?",["สั่นสะเทือนขนานกับทิศทางการเคลื่อนที่","สั่นสะเทือนตั้งฉากกับทิศทางการเคลื่อนที่","เคลื่อนที่เฉพาะบนผิวโลก","เคลื่อนที่ช้ากว่าคลื่นผิว"],1],
["คลื่นแผ่นดินไหวชนิดใดทำให้เกิดความเสียหายบนผิวโลกมากที่สุด?",["คลื่นปฐม","คลื่นทุติย","คลื่นผิว","คลื่นกัมมันตภาพรังสี"],2],
["แนวรอยแตกหรือรอยเลื่อนของชั้นหินในเปลือกโลกที่มีการเคลื่อนที่เกิดแผ่นดินไหว เรียกว่าอะไร?",["แนวรอยเลื่อน","แนวภูเขา","แนวชายฝั่ง","แนวแม่น้ำ"],0],
["แผ่นดินไหวที่เกิดขึ้นหลังแผ่นดินไหวหลัก เรียกว่าอะไร?",["แผ่นดินไหวนำ","แผ่นดินไหวรอง","แผ่นดินไหวเทียม","แผ่นดินไหวหลัก"],1],
["แผ่นดินไหวขนาดใดมักไม่ค่อยรู้สึกถึงการสั่นสะเทือน?",["น้อยกว่า 3.0 ริกเตอร์","4.0–5.0 ริกเตอร์","5.0–6.0 ริกเตอร์","มากกว่า 7.0 ริกเตอร์"],0],
["ข้อใดเป็นผลกระทบที่อาจเกิดขึ้นจากแผ่นดินไหว?",["สึนามิ","พายุหมุนเขตร้อน","ฝนแล้ง","หมอกควัน"],0],
["สึนามิมักเกิดจากแผ่นดินไหวที่เกิดขึ้นบริเวณใด?",["บนภูเขาสูง","พื้นท้องทะเลหรือมหาสมุทร","กลางเมือง","บนที่ราบสูง"],1],
["การแจ้งความรุนแรงของแผ่นดินไหวตามผลกระทบที่เกิดขึ้นกับสิ่งก่อสร้างและสิ่งแวดล้อม ใช้มาตราใด?",["มาตราริกเตอร์","มาตราเมอร์คาลี","มาตราเซลเซียส","มาตราเคลวิน"],1],
["เปลือกโลกแบ่งออกเป็นกี่ประเภทหลัก?",["1 ประเภท","2 ประเภท (เปลือกโลกภาคพื้นและภาคสมุทร)","3 ประเภท","4 ประเภท"],1],
["แผ่นเปลือกโลกเคลื่อนที่ไปบนชั้นใดของโลก?",["แมนเทิล","แก่นโลกชั้นนอก","แก่นโลกชั้นใน","เปลือกโลกชั้นล่าง"],0],
["การเคลื่อนที่ของแผ่นเปลือกโลกมีกี่รูปแบบหลัก?",["1 รูปแบบ","2 รูปแบบ","3 รูปแบบ (ชนกัน, แยกจากกัน, เลื่อนผ่านกัน)","4 รูปแบบ"],2],
["เมื่อเกิดแผ่นดินไหวขณะอยู่ในอาคาร ควรปฏิบัติตามข้อใด?",["วิ่งออกไปข้างนอกทันที","หมอบลง กำบังศีรษะ อยู่กับที่","ยืนใกล้หน้าต่าง","ใช้ลิฟต์ลงมาด้านล่าง"],1],
["ข้อใดเป็นการปฏิบัติที่ถูกต้องเมื่อเกิดแผ่นดินไหวขณะอยู่กลางแจ้ง?",["ยืนใกล้อาคารสูง","อยู่ห่างจากเสาไฟ ต้นไม้ ป้ายใหญ่","วิ่งเข้าไปในอาคาร","ยืนใกล้หน้าผา"],1],
["ปัจจัยใดที่ทำให้ความเสียหายจากแผ่นดินไหวเพิ่มมากขึ้น?",["สิ่งก่อสร้างไม่ได้มาตรฐาน","พื้นดินเป็นหินแข็ง","ประชาชนมีความรู้","มีระบบเตือนภัย"],0],
["ในปัจจุบันเราสามารถคาดการณ์เวลาและสถานที่เกิดแผ่นดินไหวได้อย่างแม่นยำหรือไม่?",["ได้ แจ้งล่วงหน้าหลายวัน","ยังไม่ได้อย่างแม่นยำ","ได้ แจ้งล่วงหน้าหลายชั่วโมง","ได้ แจ้งล่วงหน้าหลายเดือน"],1],
["พื้นที่ใดของโลกมักเกิดแผ่นดินไหวบ่อยที่สุด?",["บริเวณแนวรอยต่อแผ่นเปลือกโลก","กลางแผ่นดินทวีป","ขั้วโลกเหนือและใต้","กลางมหาสมุทร"],0],
["แนวรอยเลื่อนแม่จันตั้งอยู่ในประเทศไทยบริเวณภาคใด?",["ภาคเหนือ","ภาคใต้","ภาคอีสาน","ภาคกลาง"],0],
["ข้อใดไม่ใช่ลักษณะของคลื่นปฐม (P-wave)?",["เคลื่อนที่ผ่านของแข็ง ของเหลว และแก๊สได้","เป็นคลื่นตามยาว","สั่นฉากกับทิศทางการเคลื่อนที่","เดินทางเร็วที่สุด"],2],
["วิธีใดช่วยลดความสูญเสียจากแผ่นดินไหวได้ดีที่สุดในระยะยาว?",["ก่อสร้างตามหลักวิศวกรรมต้านทานแผ่นดินไหว","หลีกเลี่ยงการอยู่อาศัย","สร้างอาคารสูงๆ","ปลูกต้นไม้รอบอาคาร"],0]
]
const TOTAL=25;
let state="menu",i=0,good=0,bad=0,x=0,timer=null,last=0,quiz=[];
function makeQuiz(){quiz=data.map(v=>v).sort(()=>Math.random()-.5)}
for(let n=0;n<18;n++){let s=document.createElement("div");s.className="scene";s.style.left=n*100+"vw";let p=[1,2,3,4,5].sort(()=>Math.random()-.5);s.innerHTML=`<div class="mountains"><div class="mountain m1"></div><div class="mountain m2"></div><div class="mountain m3"></div></div><div class="city">${p.map(v=>`<div class="building b${v}"></div>`).join("")}</div><div class="tree" style="left:${8+n%70}%"><div class="trunk"></div><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div></div><div class="tree" style="left:${65+n%25}%"><div class="trunk"></div><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div></div><div class="lamp" style="left:${25+n%55}%"></div><div class="car" style="left:${35+n%45}%"><div class="wheel w1"></div><div class="wheel w2"></div></div><div class="ground"></div><div class="sidewalk"></div><div class="road"></div>`;world.appendChild(s)}
function hud(){prog.textContent=i+"/25";ok.textContent=good}function say(s,ms=1800){clearTimeout(timer);msg.textContent=s;msg.classList.add("show");timer=setTimeout(()=>msg.classList.remove("show"),ms)}
function walk(){state="walk";player.classList.remove("fall");player.classList.add("walk");world.classList.remove("shake")}
function question(){if(i>=TOTAL)return finish();state="question";player.classList.remove("walk");world.classList.add("shake");q.textContent=quiz[i][0];answers.innerHTML="";quiz[i][1].forEach((a,n)=>{let b=document.createElement("button");b.className="answer";b.textContent=a;b.onclick=()=>answer(n);answers.appendChild(b)});qbox.classList.add("show")}
function answer(n){if(state!=="question")return;let bs=[...answers.children];bs.forEach(b=>b.disabled=true);if(n===quiz[i][2]){bs[n].classList.add("correct");good++;i++;hud();qbox.classList.remove("show");world.classList.remove("shake");say("✅ ถูก! เดินต่ออีก 3–5 วินาที",2200);walk();timer=setTimeout(question,4000)}else{bs[n].classList.add("wrong");bad++;state="fall";world.classList.remove("shake");player.classList.remove("walk");player.classList.add("fall");say("❌ ผิด! เริ่มเกมใหม่",1300);timer=setTimeout(start,1300)}}
function start(){clearTimeout(timer);i=0;good=0;bad=0;x=0;makeQuiz();hud();world.style.transform="translate3d(0,0,0)";qbox.classList.remove("show");$("end").classList.add("hidden");$("start").classList.add("hidden");walk();say("🚶 เริ่มเดิน... อีก 3–5 วินาทีพบคำถาม",2200);timer=setTimeout(question,4000)}
function finish(){state="done";player.classList.remove("walk");world.classList.remove("shake");qbox.classList.remove("show");$("fc").textContent=good;$("fw").textContent=bad;$("end").classList.remove("hidden")}
function loop(now){if(!last)last=now;let dt=Math.min((now-last)/1000,.05);last=now;if(state==="walk"){x-=115*dt;let w=innerWidth*9;if(x<=-w)x+=w;world.style.transform=`translate3d(${x}px,0,0)`}requestAnimationFrame(loop)}
$("startBtn").onclick=start;$("again").onclick=start;hud();requestAnimationFrame(loop)})()
</script></body></html>
